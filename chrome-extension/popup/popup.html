<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KeepAwake</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <img src="../icons/icon48.png" alt="KeepAwake" class="logo">
            <h1>KeepAwake</h1>
        </div>
        
        <div class="status" id="status">
            <span class="status-icon" id="status-icon">🔘</span>
            <span class="status-text" id="status-text">OFF</span>
        </div>
        
        <div class="controls">
            <button id="toggleBtn" class="btn btn-primary">Start</button>
            <button id="stopBtn" class="btn btn-secondary" disabled>Stop</button>
        </div>
        
        <div class="options">
            <div class="option-group">
                <label for="timeout">Timeout (minutes):</label>
                <input type="number" id="timeout" value="0" min="0" max="1440">
                <span class="hint">0 = never turn off</span>
            </div>
            
            <div class="option-group">
                <label for="showNotification">
                    <input type="checkbox" id="showNotification" checked>
                    Show notification
                </label>
            </div>
        </div>
        
        <div class="info">
            <p>Prevents your screen from turning off while Chrome is open.</p>
            <p class="note">Note: This works best when Chrome is in fullscreen mode or the tab is active.</p>
        </div>
        
        <div class="footer">
            <a href="#" id="installAndroidApp">Install Android App</a>
        </div>
    </div>
    
    <script src="popup.js"></script>
</body>
</html>
